<style>
  html, body { height: 100%; background: #0F172A; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .key { font-variant-numeric: tabular-nums; }
  .key:active { transform: scale(.96); background: #E2E8F0; }
  .dot { width: 64px; height: 76px; }
  video { transform: scaleX(-1); }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pop { animation: pop .25s ease-out; }
  #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(120% 90% at 50% 45%, #FFFFFF 0%, #F4F7FC 60%, #E9EEF7 100%); transition: opacity .8s ease, background-color .8s ease; }
  #splash .lg { position: relative; width: min(62vw, 110vh, 640px); aspect-ratio: 445 / 218; opacity: 0; transform: scale(1.07); filter: blur(14px); animation: lgIn 1.4s cubic-bezier(.16,.84,.24,1) .2s forwards; }
  #splash .lg img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 30px rgba(30,64,175,.18)); }
  #splash .lg::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.75) 50%, transparent 65%); background-size: 250% 100%; background-position: 130% 0; mix-blend-mode: soft-light; opacity: 0; animation: shine 1.1s ease-in-out 1.25s forwards; pointer-events: none; }
  #splash .ln { width: 0; height: 1px; margin-top: 5vh; background: linear-gradient(90deg, transparent, #1E40AF 50%, transparent); opacity: .5; animation: ln 1s cubic-bezier(.16,.84,.24,1) 1.35s forwards; }
  #splash .tg { margin-top: 14px; font-size: clamp(12px, 1.6vw, 17px); letter-spacing: .42em; text-indent: .42em; font-weight: 600; color: #1E3A8A; opacity: 0; transform: translateY(8px); animation: tg .9s ease-out 1.55s forwards; white-space: nowrap; }
  #splash.out { pointer-events: none; }
  #splash.out .lg, #splash.out .ln, #splash.out .tg { opacity: 0 !important; filter: blur(6px); transform: scale(1.03); transition: opacity .45s ease, filter .45s ease, transform .45s ease; animation: none; }
  #splash.gone { opacity: 0; transition: opacity .55s ease; }
  @keyframes lgIn { to { opacity: 1; transform: scale(1); filter: blur(0); } }
  @keyframes shine { 0% { opacity: 0; background-position: 130% 0; } 20% { opacity: 1; } 100% { opacity: 0; background-position: -30% 0; } }
  @keyframes ln { to { width: min(46vw, 420px); } }
  @keyframes tg { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #splash .lg, #splash .ln, #splash .tg { animation-duration: .01s; animation-delay: 0s; } }
  /* 화면 높이에 꽉 맞추기 (스크롤 없음) */
  #root { height: 100vh; height: 100dvh; overflow: hidden; }
  #root > section { min-height: 0; }
  .key { height: clamp(3.25rem, 9.5vh, 5rem); }
  /* 가로로 둔 태블릿: 왼쪽 안내 + 오른쪽 숫자판 */
  @media (orientation: landscape) and (max-height: 900px) {
    #s-pad { flex-direction: row; gap: 5vw; padding-bottom: 2vh; }
    #s-pad .padleft { flex: 0 1 26rem; }
    #s-pad .padkeys { margin-top: 0; width: min(28rem, 44vw); max-width: none; gap: 1.6vh 0.9rem; }

<script>
const API = (window.CRM_API_BASE || 'https://project-ps3ps.vercel.app') + '/api/crm';
const KEY = 'kiosk_token';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get: () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } }, set: (v) => { try { localStorage.setItem(KEY, v); } catch (e) {} }, del: () => { try { localStorage.removeItem(KEY); } catch (e) {} } };

// '띵동' (Web Audio로 만든 2음 차임)
let _ac = null;
function dingdong() {
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)(); if (_ac.state === 'suspended') _ac.resume();
    const t0 = _ac.currentTime + 0.02;
    [[659.25, 0], [523.25, 0.55], [659.25, 1.6], [523.25, 2.15]].forEach(([f, d]) => {
      [[1, 0.5], [2.01, 0.12], [3.02, 0.05]].forEach(([h, g]) => {
        const o = _ac.createOscillator(), v = _ac.createGain(); o.type = 'sine'; o.frequency.value = f * h;
        v.gain.setValueAtTime(0.0001, t0 + d); v.gain.exponentialRampToValueAtTime(g, t0 + d + 0.015); v.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 1.4);
        o.connect(v).connect(_ac.destination); o.start(t0 + d); o.stop(t0 + d + 1.45);
      });
    });
  } catch (e) {}
}
// ── 음성 인사 (태블릿 내장 한국어 음성) ──
const voiceOn = { get: () => { try { return localStorage.getItem('kiosk_voice') !== 'off'; } catch (e) { return true; } }, set: (v) => { try { localStorage.setItem('kiosk_voice', v ? 'on' : 'off'); } catch (e) {} } };
let koVoice = null;
function pickVoice() { const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || []; koVoice = vs.find((v) => /ko[-_]KR/i.test(v.lang) && /google|yuna|female|여/i.test(v.name)) || vs.find((v) => /^ko/i.test(v.lang)) || null; }
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!text || !voiceOn.get() || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice; u.rate = 1.0; u.pitch = 1.05; speechSynthesis.speak(u); } catch (e) {}
}
function renderVoiceBtn() { $('voice-btn').textContent = voiceOn.get() ? '🔊' : '🔇'; }
// 회원 인사말: 처음 / 오랜만 / 기념 횟수 / 이번 달 횟수 / 시간대 순서로 하나만
function greetLine(r) {
  if (r.blocked) return '안녕하세요! 인포에 잠깐 들러 주세요';
  if (r.again || r.dup) return '다시 오셨네요! 반가워요';
  if (r.first_time) return '990짐에 오신 걸 환영해요! 첫 운동 응원할게요';
  const g = r.gap_days || 0;
  if (g >= 30) return '정말 오랜만이에요! 다시 와 주셔서 반가워요. 오늘부터 다시 같이 해 봐요';
  if (g >= 14) return `${Math.floor(g / 7)}주 만에 오셨네요! 반가워요. 앞으로 열심히 해 봐요`;
  if (g >= 7) return '일주일 만이에요! 다시 힘내 봐요';
  if ([50, 100, 150, 200, 300, 500, 1000].includes(r.visits)) return `오늘이 ${r.visits}번째 운동이에요! 축하해요`;
  if ([10, 15, 20, 25].includes(r.this_month)) return `이번 달 벌써 ${r.this_month}번째 운동이에요. 정말 멋져요!`;
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return '좋은 아침이에요! 오늘도 반가워요';
  if (h >= 17 && h < 22) return '오늘 하루도 수고 많으셨어요. 반가워요';
  if (h >= 22 || h < 5) return '늦은 시간까지 대단해요! 반가워요';
  return '안녕하세요! 오늘도 반가워요';
}

async function post(body, tokenOverride) {
  const t = tokenOverride || store.get();
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', ...(t ? { Authorization: `Bearer ${t}` } : {}) }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { store.del(); show('setup'); throw new Error('기기 등록이 필요해요'); }
  if (!res.ok) throw new Error(data.error || '잠시 후 다시 눌러주세요');
  return data;
}

function show(name) { ['setup', 'pad', 'pick', 'done', 'photo'].forEach((s) => $('s-' + s).classList.toggle('hidden', s !== name)); if (name !== 'photo') stopCam(); }
let idle;
function home(delay = 0) { clearTimeout(idle); idle = setTimeout(() => { digits = ''; renderDots(); $('pad-msg').textContent = ''; show('pad'); }, delay); }
document.querySelectorAll('[data-home]').forEach((b) => b.onclick = () => home());
setInterval(() => { const d = new Date(); $('clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }, 1000);

// ── 기기 등록 ──
$('setup-btn').onclick = async () => {
  const err = $('setup-err'); err.classList.add('hidden');
  try {
    const login = await fetch(API.replace('/crm', '/admin'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'login', password: $('setup-pw').value }) });
    const lj = await login.json().catch(() => ({}));
    if (!login.ok) throw new Error(lj.error || '비밀번호가 맞지 않아요');
    const r = await post({ action: 'kioskRegister' }, lj.token);
    store.set(r.token); $('setup-pw').value = ''; home(); playSplash();
  } catch (e) { err.textContent = e.message; err.classList.remove('hidden'); }
};
$('reset-device').onclick = () => { if (confirm('이 태블릿의 입실 체크 등록을 해제할까요?')) { store.del(); show('setup'); } };

// ── 번호 입력 ──
let digits = '', busy = false;
const isStaffNo = () => digits.startsWith('010');
const maxLen = () => (isStaffNo() ? 11 : 4);
function renderDots() {
  if (isStaffNo() && digits.length > 3) {
    const d = digits.padEnd(11, '·');
    $('dots').innerHTML = `<div class="h-[76px] px-6 rounded-2xl bg-white/15 flex items-center text-4xl font-black tabular-nums tracking-wider text-white">${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}</div>`;
    return;
  }
  $('dots').innerHTML = [0, 1, 2, 3].map((i) => `<div class="dot rounded-2xl ${digits[i] ? 'bg-white' : 'bg-white/15'} flex items-center justify-center text-4xl font-black tabular-nums">${digits[i] || ''}</div>`).join('');
}
// 010으로 시작하면 직원 번호(11자리)일 수 있어서 4자리에서 바로 찾지 않고 잠깐 기다린다 (회원 뒷자리가 010x인 경우)
let waitMember = null;
document.querySelectorAll('.key').forEach((b) => b.addEventListener('click', () => {
  if (busy) return;
  const k = b.dataset.k; $('pad-msg').textContent = ''; clearTimeout(waitMember);
  if (k === 'C') digits = ''; else if (k === 'B') digits = digits.slice(0, -1); else if (digits.length < maxLen()) digits += k;
  renderDots();
  clearTimeout(idle); idle = setTimeout(() => home(), 30000);
  if (digits.length === 11 && isStaffNo()) return punch();
  if (digits.length === 4 && !isStaffNo()) return find();
  if (digits.length === 4 && isStaffNo()) waitMember = setTimeout(() => { if (digits.length === 4) find(); }, 1800);
}));
// ── 직원 출퇴근 ──
async function punch() {
  busy = true;
  try {
    const r = await post({ action: 'staffPunch', phone: digits });
    const t = new Date(r.at), hm = `${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}`;
    const w = r.worked_min >= 60 ? `${Math.floor(r.worked_min / 60)}시간${r.worked_min % 60 ? ` ${r.worked_min % 60}분` : ''}` : `${r.worked_min}분`;
    const out = r.kind === '퇴근';
    $('done-card').innerHTML = `<div class="w-40 h-40 rounded-full mx-auto ${out ? 'bg-slate-100 text-slate-500' : 'bg-blue-50 text-blue-600'} flex items-center justify-center text-5xl font-black">${out ? '퇴근' : '출근'}</div>
      <div class="mt-5 text-3xl font-extrabold">${esc(r.name)}님 ${out ? '퇴근' : '출근'} · ${hm}</div>
      <div class="mt-3 text-xl font-bold text-slate-500">${r.dup ? '방금 이미 찍혔어요' : out ? `오늘 총 ${w} 근무했어요. 수고하셨어요!` : '오늘도 잘 부탁해요!'}</div>`;
    show('done'); home(4000);
    if (!r.dup) say(out ? '오늘도 수고 많으셨어요!' : '출근하셨네요! 오늘도 잘 부탁해요');
  } catch (e) { $('pad-msg').textContent = e.message; digits = ''; setTimeout(renderDots, 900); }
  finally { busy = false; }
}
async function find() {
  busy = true;
  try {
    const { matches } = await post({ action: 'checkinFind', digits });
    if (!matches.length) { $('pad-msg').textContent = '등록된 번호가 없어요. 인포에 말씀해 주세요.'; digits = ''; setTimeout(renderDots, 600); return; }
    if (matches.length === 1) return enter(matches[0].id);
    $('pick-list').innerHTML = matches.map((m) => `<button data-id="${m.id}" class="pick w-full py-5 rounded-2xl bg-white text-2xl font-extrabold flex items-center justify-center gap-3 ${m.active ? '' : 'opacity-60'}">${esc(m.name)}${m.active ? '' : '<span class="text-sm font-bold text-slate-500">(이용권 끝남)</span>'}</button>`).join('');
    document.querySelectorAll('.pick').forEach((b) => b.onclick = () => enter(b.dataset.id));
    show('pick'); idle = setTimeout(() => home(), 20000);
  } catch (e) { $('pad-msg').textContent = e.message; digits = ''; setTimeout(renderDots, 600); }
  finally { busy = false; }
}

// ── 입실 ──
let current = null;
async function enter(id) {
  clearTimeout(idle);
  try {
    const r = await post({ action: 'checkin', id });
    current = { id, ...r };
    if (!r.blocked && r.needs_photo) return startPhoto();
    done(r);
  } catch (e) { show('pad'); $('pad-msg').textContent = e.message; digits = ''; renderDots(); }
}
function done(r, justSaved) {
  const face = r.photo_url ? `<img src="${esc(r.photo_url)}" class="w-40 h-40 rounded-full object-cover mx-auto ring-4 ${r.blocked ? 'ring-rose-200' : 'ring-blue-100'}" alt="">`
    : `<div class="w-40 h-40 rounded-full mx-auto bg-slate-100 flex items-center justify-center text-6xl font-black text-slate-300">${esc((r.name || '?')[0])}</div>`;
  let body;
  if (r.blocked) body = `<div class="mt-5 text-3xl font-extrabold">${esc(r.name)}님</div><div class="mt-3 text-xl font-bold text-rose-600">${esc(r.reason)}</div>`;
  else {
    const left = r.sub === '구독 중' || r.sub === '쉬어가기' ? `<span class="text-blue-600">월구독</span>${r.next_billing ? ` <span class="text-sm text-slate-500">${+r.next_billing.slice(5, 7)}.${+r.next_billing.slice(8)} 결제</span>` : ''}` : r.days_left == null ? '' : r.days_left <= 0 ? '<span class="text-rose-600">오늘까지예요</span>' : `<span class="${r.days_left <= 14 ? 'text-rose-600' : 'text-blue-600'}">${r.days_left}일</span> 남았어요`;
    body = `<div class="mt-5 text-3xl font-extrabold">${esc(r.name)}님, ${r.again ? '이미 입실하셨어요' : '환영해요!'}</div>
      <!--GREET-->
      ${justSaved ? '<div class="mt-2 text-base font-bold text-blue-600">사진이 저장됐어요</div>' : ''}
      <div class="mt-5 grid ${r.pt_total ? 'grid-cols-3' : 'grid-cols-2'} gap-3 tabular-nums">
        <div class="rounded-2xl bg-slate-50 border border-slate-200 p-3"><div class="text-sm font-bold text-slate-500">남은 기간</div><div class="mt-1 text-xl font-extrabold">${left || '-'}</div></div>
        ${r.pt_total ? `<div class="rounded-2xl bg-slate-50 border border-slate-200 p-3"><div class="text-sm font-bold text-slate-500">PT</div><div class="mt-1 text-xl font-extrabold"><span class="text-rose-600">${r.pt_left}</span>회 남음</div></div>` : ''}
        <div class="rounded-2xl bg-slate-50 border border-slate-200 p-3"><div class="text-sm font-bold text-slate-500">이번 달</div><div class="mt-1 text-xl font-extrabold">${r.this_month}번째</div></div>
      </div>
      ${r.days_left != null && r.days_left <= 14 && r.days_left >= 0 ? '<div class="mt-4 text-base font-bold text-slate-600">이용권이 곧 끝나요. 연장은 인포에서 도와드릴게요</div>' : ''}`;
  }
  const line = greetLine(r);
  if (!r.blocked) body = body.replace('<!--GREET-->', `<div class="mt-2 text-lg font-bold text-blue-600">${esc(line)}</div>`);
  $('done-card').innerHTML = face + body;
  show('done'); home(r.blocked ? 7000 : 5000);
  say(line);
}

// ── 사진 ──
let stream = null, shotData = null;
async function startPhoto() {
  show('photo'); shotData = null;
  $('shot').classList.add('hidden'); $('after-snap').classList.add('hidden'); $('btn-snap').parentElement.classList.remove('hidden'); $('cam-msg').classList.add('hidden');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 720 } }, audio: false });
    $('cam').srcObject = stream;
  } catch (e) {
    $('cam-msg').textContent = '카메라를 쓸 수 없어요. 인포에 말씀해 주세요.'; $('cam-msg').classList.remove('hidden');
  }
  idle = setTimeout(() => done(current), 45000);
}
function stopCam() { if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } }
$('btn-snap').onclick = () => {
  const v = $('cam'); if (!v.videoWidth) return;
  const size = Math.min(v.videoWidth, v.videoHeight), c = document.createElement('canvas'); c.width = c.height = 480;
  const ctx = c.getContext('2d'); ctx.translate(480, 0); ctx.scale(-1, 1);
  ctx.drawImage(v, (v.videoWidth - size) / 2, (v.videoHeight - size) / 2, size, size, 0, 0, 480, 480);
  shotData = c.toDataURL('image/jpeg', 0.82);
  $('shot').src = shotData; $('shot').classList.remove('hidden');
  $('btn-snap').parentElement.classList.add('hidden'); $('after-snap').classList.remove('hidden');
};
$('btn-retake').onclick = () => { shotData = null; $('shot').classList.add('hidden'); $('after-snap').classList.add('hidden'); $('btn-snap').parentElement.classList.remove('hidden'); };
$('btn-skip').onclick = () => { clearTimeout(idle); done(current); };
$('btn-save').onclick = async () => {
  if (!shotData) return;
  clearTimeout(idle); $('btn-save').textContent = '저장 중…';
  try { const r = await post({ action: 'photoUpload', id: current.id, image: shotData }); current.photo_url = r.photo_url; done(current, true); }
  catch (e) { alert(e.message); done(current); }
  finally { $('btn-save').textContent = '이 사진으로 저장'; }
};

renderDots();
renderVoiceBtn();
// 시작 화면: 흰 바탕에 990 로고가 또렷해진 뒤 번호 입력 화면으로 부드럽게 (앱을 켤 때, 기기 등록 직후)
function playSplash() {
  let sp = $('splash');
  if (!sp) { sp = document.createElement('div'); sp.id = 'splash'; sp.setAttribute('aria-hidden', 'true'); sp.innerHTML = '<div class="lg"><img src="/checkin-logo.png" alt=""></div><div class="ln"></div><div class="tg">NATURAL COMFORT · BALANCED STYLE</div>'; document.body.appendChild(sp); }
  setTimeout(() => { sp.classList.add('out'); setTimeout(() => { sp.classList.add('gone'); setTimeout(() => sp.remove(), 600); }, 420); }, 3000);
}
playSplash();
// 화면 꺼짐 방지 (입실 체크용 태블릿)
async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) {} }
keepAwake(); document.addEventListener('visibilitychange', keepAwake);
// 직원 호출: 태블릿에서 띵동 + 직원 폰 알림
$('call-btn').addEventListener('click', async () => {
  if (busy) return; busy = true; clearTimeout(idle);
  dingdong();
  $('done-card').innerHTML = `<div class="w-40 h-40 rounded-full mx-auto bg-amber-50 flex items-center justify-center text-7xl">🔔</div>
    <div class="mt-5 text-3xl font-extrabold">직원을 불렀어요</div><div class="mt-3 text-xl font-bold text-slate-500">곧 갈게요. 잠시만 기다려 주세요!</div>`;
  show('done');
  try { await post({ action: 'staffCall' }); setTimeout(() => say('직원을 불렀어요. 잠시만 기다려 주세요'), 2600); }
  catch (e) { $('done-card').innerHTML = `<div class="text-2xl font-extrabold">호출이 안 됐어요</div><div class="mt-3 text-lg font-bold text-rose-600">${esc(e.message)}</div><div class="mt-2 text-slate-500">인포로 직접 와 주세요</div>`; }
  finally { busy = false; home(7000); }
});
$('voice-btn').addEventListener('click', () => { const on = !voiceOn.get(); voiceOn.set(on); renderVoiceBtn(); if (on) say('음성 인사를 켰어요'); else window.speechSynthesis && speechSynthesis.cancel(); });
if (store.get()) show('pad'); else show('setup');
</script>
</body>
