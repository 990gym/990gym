<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>990짐 관리자</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --navy: #1a2744;
    --blue: #285FC7;
    --gray: #f5f6fa;
    --text: #222;
    --text-light: #666;
    --border: #e0e4ef;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
    --purple: #8b5cf6;
  }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--gray); color: var(--text); min-height: 100vh; }
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--navy); }
  .login-box { background: white; border-radius: 16px; padding: 48px 40px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .login-logo { font-size: 24px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
  .login-sub { font-size: 13px; color: var(--text-light); margin-bottom: 32px; }
  .login-box input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s; }
  .login-box input:focus { border-color: var(--blue); }
  .login-btn { width: 100%; padding: 13px; background: var(--navy); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; font-family: inherit; transition: background 0.2s; }
  .login-btn:hover { background: var(--blue); }
  .login-error { color: var(--red); font-size: 13px; margin-top: 8px; display: none; }
  #admin-screen { display: none; }
  .header { background: var(--navy); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
  .header-logo { color: white; font-size: 18px; font-weight: 700; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-link { background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; text-decoration: none; display: inline-block; }
  .header-link:hover { background: rgba(255,255,255,0.2); }
  .header-link.highlight { background: var(--purple); }
  .header-link.highlight:hover { background: #7c3aed; }
  .header-link.alert-on { background: #16a34a; }
  .header-link.alert-off { background: #b91c1c; }
  .signup-toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 2000; background: #111827; color: white; padding: 14px 18px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); display: none; align-items: center; gap: 14px; font-size: 15px; max-width: calc(100vw - 32px); }
  .signup-toast.show { display: flex; }
  .signup-toast b { color: #4ade80; }
  .signup-toast button { background: rgba(255,255,255,0.15); color: white; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-family: inherit; font-size: 13px; flex-shrink: 0; }
  .session-timer { color: rgba(255,255,255,0.6); font-size: 13px; }
  .logout-btn { background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
  .logout-btn:hover { background: rgba(255,255,255,0.2); }
  .main { padding: 32px clamp(12px, 2.5vw, 32px); margin: 0 auto; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
  .stat-card { background: white; border-radius: 12px; padding: 24px; border: 1px solid var(--border); }
  .stat-label { font-size: 13px; color: var(--text-light); margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--navy); }
  .stat-sub { font-size: 12px; color: var(--text-light); margin-top: 4px; }
  .table-wrap { background: white; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; margin-bottom: 24px; }
  .table-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .table-title { font-size: 16px; font-weight: 600; }
  .refresh-btn { background: var(--gray); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; color: var(--text); }
  .refresh-btn:hover { background: var(--border); }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--gray); padding: 12px; text-align: left; font-size: 12px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  td { padding: 14px 12px; border-bottom: 1px solid var(--border); font-size: 14px; white-space: nowrap; }
  td:first-child { white-space: normal; min-width: 80px; max-width: 120px; word-break: break-word; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbff; }
  td.col-email { white-space: normal; word-break: break-all; min-width: 130px; font-size: 13px; color: var(--text-light); }
  .actions { display: flex; flex-wrap: nowrap; gap: 4px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge-active { background: #dcfce7; color: #16a34a; }
  .badge-cancelled { background: #fee2e2; color: #dc2626; }
  .action-btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; transition: opacity 0.2s; white-space: nowrap; }
  .action-btn:hover { opacity: 0.8; }
  .btn-cancel { background: #fee2e2; color: #dc2626; }
  .btn-activate { background: #dcfce7; color: #16a34a; }
  .btn-plan { background: #fef3c7; color: #d97706; }
  .btn-billing { background: #dbeafe; color: #2563eb; }
  .modal-btn-confirm.blue { background: #2563eb; color: white; }
  .billing-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; }
  .billing-row label { width: 84px; color: var(--text-light); flex-shrink: 0; white-space: nowrap; }
  .billing-row input { flex: 1; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; min-width: 0; }
  .billing-row input:focus { border-color: var(--blue); }
  .billing-quick { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .billing-quick button { padding: 6px 10px; border: 1px solid var(--border); background: white; border-radius: 6px; font-size: 12px; font-family: inherit; cursor: pointer; }
  .billing-quick button:hover { background: var(--gray); }
  .billing-preview { margin-top: 14px; padding: 10px 12px; background: var(--gray); border-radius: 8px; font-size: 13px; line-height: 1.6; }
  .billing-error { margin-top: 10px; font-size: 13px; color: #dc2626; display: none; }
  .loading { text-align: center; padding: 48px; color: var(--text-light); }
  .empty { text-align: center; padding: 48px; color: var(--text-light); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: white; border-radius: 16px; padding: 32px; width: 400px; max-width: calc(100vw - 32px); box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .modal-desc { font-size: 14px; color: var(--text-light); margin-bottom: 24px; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit; }
  .modal-btn-cancel { background: var(--gray); color: var(--text); }
  .modal-btn-confirm { background: var(--red); color: white; }
  .modal-btn-confirm.green { background: var(--green); }
  .modal-btn-confirm.orange { background: var(--orange); color: white; }
  .plan-select { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; margin-top: 8px; }
  .plan-select:focus { border-color: var(--blue); }
  .churn-input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; margin-top: 8px; }
  .churn-input:focus { border-color: var(--blue); }
  .churn-inline { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-family: inherit; color: var(--text); background: white; width: 100%; min-width: 96px; max-width: 170px; text-overflow: ellipsis; cursor: pointer; }
  .churn-inline:focus { border-color: var(--blue); outline: none; }
  /* ===== 회원 이력 ===== */
  .name-link { background: none; border: none; padding: 0; font: inherit; font-weight: 700; color: var(--navy); cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: #c7d2e8; text-underline-offset: 3px; }
  .name-link:hover { color: var(--blue); text-decoration-color: var(--blue); }
  .badge-failed { background: #fef3c7; color: #b45309; }
  .history-modal { width: 460px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; padding: 28px 28px 20px; }
  .history-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .history-close { background: none; border: none; font-size: 22px; line-height: 1; color: var(--text-light); cursor: pointer; padding: 2px 4px; }
  .history-meta { font-size: 13px; color: var(--text-light); margin-top: 4px; }
  .history-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 6px; }
  .history-summary div { background: var(--gray); border-radius: 10px; padding: 10px 12px; }
  .history-summary b { display: block; font-size: 18px; color: var(--navy); }
  .history-summary span { font-size: 12px; color: var(--text-light); }
  .history-body { overflow-y: auto; margin: 10px -4px 0; padding: 4px; }
  .timeline { list-style: none; position: relative; margin: 6px 0 4px; }
  .timeline::before { content: ''; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
  .tl-item { position: relative; padding: 0 0 18px 26px; }
  .tl-item:last-child { padding-bottom: 4px; }
  .tl-dot { position: absolute; left: 0; top: 4px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 1px var(--border); }
  .tl-signup .tl-dot, .tl-return .tl-dot { background: var(--green); }
  .tl-cancel .tl-dot { background: var(--red); }
  .tl-payment_failed .tl-dot { background: var(--orange); }
  .tl-plan_change .tl-dot { background: var(--blue); }
  .tl-date { font-size: 12px; color: var(--text-light); }
  .tl-title { font-size: 15px; font-weight: 700; margin-top: 1px; }
  .tl-detail { font-size: 13px; color: var(--text); margin-top: 2px; }
  .tl-gap { font-size: 12px; color: var(--text-light); margin-top: 3px; }
  .history-note { font-size: 12px; color: var(--text-light); background: var(--gray); border-radius: 8px; padding: 10px 12px; margin-top: 8px; line-height: 1.6; }
  /* 화면 폭에 맞춰 덜 중요한 칸부터 숨김 → 900px 이하는 카드형 */
  @media (max-width: 1280px) { .col-cancelled { display: none; } }
  @media (max-width: 1100px) { .col-email { display: none; } }
  @media (max-width: 1024px) { .col-join { display: none; } }
  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .main { padding: 16px 12px; }
    .header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
    .header-right { flex-wrap: wrap; gap: 8px; }
    .modal { padding: 24px 20px; }
    .sub-table thead { display: none; }
    .sub-table, .sub-table tbody, .sub-table tr { display: block; width: 100%; }
    .sub-table tr { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .sub-table tr:last-child { border-bottom: none; }
    .sub-table td { display: flex; align-items: center; gap: 12px; padding: 3px 0; border: none; white-space: normal; min-width: 0; max-width: none; font-size: 14px; }
    .sub-table td::before { content: attr(data-label); width: 70px; flex-shrink: 0; font-size: 12px; color: var(--text-light); }
    .sub-table td.col-name { font-size: 16px; padding-bottom: 6px; }
    .sub-table td.col-name::before { display: none; }
    .sub-table td.col-email, .sub-table td.col-join { display: flex; }
    .sub-table td.col-cancelled { display: none; }
    .sub-table td.col-actions { padding-top: 10px; }
    .sub-table .actions { flex-wrap: wrap; }
    .sub-table td.col-actions::before { display: none; }
    .sub-table .action-btn { padding: 8px 14px; font-size: 13px; }
    tr:hover td { background: none; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">990짐 관리자</div>
    <div class="login-sub">구독 회원 관리 시스템</div>
    <input type="password" id="pw-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <div class="login-error" id="login-error">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<div id="admin-screen">
  <div class="header">
    <div class="header-logo">990짐 관리자</div>
    <div class="header-right">
      <button class="header-link" id="signup-alert-btn" onclick="enableSignupAlerts()" title="새 구독자가 결제를 마치면 이 컴퓨터에 알림을 띄웁니다">🔔 신규 알림 켜기</button>
      <span class="session-timer" id="session-timer"></span>
      <a href="inquiry.html" class="header-link highlight">📋 상담 신청 <span id="inquiry-count"></span></a>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <div class="main">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">전체 구독자</div>
        <div class="stat-value" id="stat-total">-</div>
        <div class="stat-sub">누적</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">활성 구독자</div>
        <div class="stat-value" id="stat-active" style="color:var(--green)">-</div>
        <div class="stat-sub">현재</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">해지 회원</div>
        <div class="stat-value" id="stat-cancelled" style="color:var(--red)">-</div>
        <div class="stat-sub">누적</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">이번달 예상 매출</div>
        <div class="stat-value" id="stat-revenue">-</div>
        <div class="stat-sub">원</div>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-header">
        <div class="table-title">구독 회원 목록</div>
        <button class="refresh-btn" onclick="loadSubscribers()">🔄 새로고침</button>
      </div>
      <div id="table-body">
        <div class="loading">불러오는 중...</div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-desc" id="modal-desc"></div>
    <div id="churn-reason-wrap" style="display:none;margin-bottom:24px;margin-top:-8px;">
      <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;">이탈 사유</div>
      <select class="churn-input" id="churn-reason-select" style="margin-top:4px;" onchange="toggleChurnEtc()"></select>
      <input type="text" class="churn-input" id="churn-reason-etc" placeholder="사유 직접 입력" style="display:none;">
    </div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">취소</button>
      <button class="modal-btn modal-btn-confirm" id="modal-confirm-btn" onclick="confirmAction()">확인</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="history-modal" onclick="if(event.target===this)closeHistoryModal()">
  <div class="modal history-modal">
    <div class="history-head">
      <div>
        <div class="modal-title" id="history-title" style="margin-bottom:0"></div>
        <div class="history-meta" id="history-meta"></div>
      </div>
      <button class="history-close" onclick="closeHistoryModal()" aria-label="닫기">×</button>
    </div>
    <div class="history-summary" id="history-summary"></div>
    <div class="history-body" id="history-body"></div>
  </div>
</div>

<div class="modal-overlay" id="plan-modal">
  <div class="modal">
    <div class="modal-title">플랜 변경</div>
    <div class="modal-desc" id="plan-modal-desc"></div>
    <select class="plan-select" id="plan-select">
      <option value="베이직">베이직 (39,000원/월)</option>
      <option value="스탠다드">스탠다드 (69,000원/월)</option>
      <option value="프리미엄">프리미엄 (99,000원/월)</option>
    </select>
    <div style="font-size:12px;color:var(--text-light);margin-top:8px;">다음 결제일부터 변경된 플랜 금액으로 청구됩니다.</div>
    <div class="modal-btns" style="margin-top:24px;">
      <button class="modal-btn modal-btn-cancel" onclick="closePlanModal()">취소</button>
      <button class="modal-btn modal-btn-confirm orange" id="plan-confirm-btn" onclick="confirmPlanChange()">변경</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="billing-modal">
  <div class="modal">
    <div class="modal-title">결제일 변경</div>
    <div class="modal-desc" id="billing-modal-desc" style="margin-bottom:8px;"></div>
    <div class="billing-row">
      <label>며칠 미루기</label>
      <input type="number" id="billing-days" min="-60" max="120" step="1" placeholder="예: 8" oninput="onBillingDaysInput()">
    </div>
    <div class="billing-quick">
      <button type="button" onclick="setBillingDays(7)">+7일</button>
      <button type="button" onclick="setBillingDays(14)">+14일</button>
      <button type="button" onclick="setBillingDays(30)">+30일</button>
    </div>
    <div class="billing-row">
      <label>새 결제일</label>
      <input type="date" id="billing-date" oninput="onBillingDateInput()">
    </div>
    <div class="billing-preview" id="billing-preview"></div>
    <div class="billing-error" id="billing-error"></div>
    <div style="font-size:12px;color:var(--text-light);margin-top:10px;">자동결제는 결제일 당일 오후 6시에 진행됩니다. 오늘 이전 날짜는 저장할 수 없습니다.</div>
    <div class="modal-btns" style="margin-top:20px;">
      <button class="modal-btn modal-btn-cancel" onclick="closeBillingModal()">취소</button>
      <button class="modal-btn modal-btn-confirm blue" id="billing-confirm-btn" onclick="confirmBillingChange()">변경</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://twwpxtveupsqwenkprdw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3d3B4dHZldXBzcXdlbmtwcmR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTcyNjYsImV4cCI6MjA4OTIzMzI2Nn0.uoDrUFNiLhDVTHDeGOWPBeQCeI5kzTOP678r9rLbioM';
const VERCEL_URL = 'https://project-ps3ps.vercel.app';
const ADMIN_PW = '990gym2026!';
const PLAN_PRICES = { '베이직': 39000, '스탠다드': 69000, '프리미엄': 99000 };
const CHURN_REASONS = ['기간권 전환', '이사', '개인사정', '운동중단', '부상', '가격 부담', '타 시설 이동', '기타'];
const SESSION_TIMEOUT = 30 * 60 * 1000;

let currentAction = null;
let currentPlanAction = null;
let subscribers = [];
let sessionInterval = null;
let sessionExpiry = null;

function doLogin() {
  const pw = document.getElementById('pw-input').value;
  if (pw === ADMIN_PW) {
    sessionStorage.setItem('admin_logged_in', '1');
    sessionExpiry = Date.now() + SESSION_TIMEOUT;
    sessionStorage.setItem('admin_expiry', sessionExpiry);
    showAdmin();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

function showAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  loadSubscribers();
  loadInquiryCount();
  startSessionTimer();
  document.addEventListener('mousemove', resetSessionTimer);
  document.addEventListener('keydown', resetSessionTimer);
  document.addEventListener('click', resetSessionTimer);
}

function startSessionTimer() {
  if (sessionInterval) clearInterval(sessionInterval);
  sessionInterval = setInterval(function() {
    const remaining = sessionExpiry - Date.now();
    if (remaining <= 0) { doLogout(true); return; }
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    document.getElementById('session-timer').textContent = `${mins}:${secs.toString().padStart(2,'0')} 후 자동 로그아웃`;
  }, 1000);
}

function resetSessionTimer() {
  sessionExpiry = Date.now() + SESSION_TIMEOUT;
  sessionStorage.setItem('admin_expiry', sessionExpiry);
}

function doLogout(auto) {
  sessionStorage.removeItem('admin_logged_in');
  sessionStorage.removeItem('admin_expiry');
  if (sessionInterval) clearInterval(sessionInterval);
  document.removeEventListener('mousemove', resetSessionTimer);
  document.removeEventListener('keydown', resetSessionTimer);
  document.removeEventListener('click', resetSessionTimer);
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('pw-input').value = '';
  if (auto) alert('30분 동안 활동이 없어 자동 로그아웃되었습니다.');
}

window.addEventListener('load', function() {
  const loggedIn = sessionStorage.getItem('admin_logged_in');
  const expiry = parseInt(sessionStorage.getItem('admin_expiry'));
  if (loggedIn && expiry && Date.now() < expiry) {
    sessionExpiry = expiry;
    showAdmin();
  }
});

async function loadSubscribers() {
  document.getElementById('table-body').innerHTML = '<div class="loading">불러오는 중...</div>';

    const res = await fetch(`${SUPABASE_URL}/rest/v1/subscribers?select=*&order=created_at.desc`, {

function renderStats() {
  const total = subscribers.length;
  const active = subscribers.filter(s => s.status === 'active').length;
  const cancelled = subscribers.filter(s => s.status === 'cancelled').length;
  const revenue = subscribers.filter(s => s.status === 'active').reduce((sum, s) => sum + (PLAN_PRICES[s.plan] || 0), 0);
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-cancelled').textContent = cancelled;
  document.getElementById('stat-revenue').textContent = revenue.toLocaleString();
}

function renderTable() {
  if (!subscribers.length) {
    document.getElementById('table-body').innerHTML = '<div class="empty">등록된 구독자가 없습니다.</div>';
    return;
  }
  let html = `<table class="sub-table"><thead><tr><th>이름</th><th>연락처</th><th class="col-email">이메일</th><th>플랜</th><th>상태</th><th>이탈사유</th><th class="col-join">가입일</th><th class="col-cancelled">해지일</th><th>다음결제일</th><th>관리</th></tr></thead><tbody>`;
  subscribers.forEach(s => {
    const date = s.created_at ? new Date(s.created_at).toLocaleDateString('ko-KR') : '-';
    const nextBilling = s.next_billing_date ? new Date(s.next_billing_date).toLocaleDateString('ko-KR') : '-';
    const cancelledAt = s.cancelled_at ? new Date(s.cancelled_at).toLocaleDateString('ko-KR') : '-';
    const statusBadge = s.status === 'active'
      ? '<span class="badge badge-active">활성</span>'
      : s.status === 'payment_failed'
        ? '<span class="badge badge-failed">결제실패</span>'
        : '<span class="badge badge-cancelled">해지</span>';
    const actionBtns = s.status === 'active'
      ? `<button class="action-btn btn-plan" onclick="openPlanModal('${s.id}', '${s.name}', '${s.plan}')">플랜변경</button>
         <button class="action-btn btn-billing" onclick="openBillingModal('${s.id}')">결제일</button>
         <button class="action-btn btn-cancel" onclick="openCancelModal('${s.id}', '${s.name}')">해지</button>`
      : `<button class="action-btn btn-activate" onclick="openActivateModal('${s.id}', '${s.name}')">복구</button>`;
    let churnCell = '-';
    if (s.status === 'cancelled') {
      const cur = s.churn_reason || '';
      let opts = `<option value="">미입력</option>`;
      CHURN_REASONS.forEach(r => {
        opts += `<option value="${r}" ${cur===r?'selected':''}>${r}</option>`;
      });
      if (cur && !CHURN_REASONS.includes(cur)) {
        opts += `<option value="${cur}" selected>${cur}</option>`;
      }
      churnCell = `<select class="churn-inline" onchange="onChurnInlineChange('${s.id}', this.value, this)">${opts}</select>`;
    }
    html += `<tr>
      <td class="col-name" data-label="이름"><button class="name-link" onclick="openHistory('${s.id}')" title="구독 이력 보기">${escHtml(s.name||'-')}</button></td>
      <td class="col-phone" data-label="연락처">${s.phone||'-'}</td>
      <td class="col-email" data-label="이메일">${s.email||'-'}</td>
      <td data-label="플랜">${s.plan||'-'}</td>
      <td data-label="상태">${statusBadge}</td>
      <td class="col-churn" data-label="이탈사유">${churnCell}</td>
      <td class="col-join" data-label="가입일">${date}</td>
      <td class="col-cancelled" data-label="해지일">${cancelledAt}</td>
      <td data-label="다음결제일">${nextBilling}</td>
      <td class="col-actions" data-label="관리"><div class="actions">${actionBtns}</div></td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('table-body').innerHTML = html;
}

async function updateChurnReason(id, reason, el) {
  el.disabled = true;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/subscribers?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ churn_reason: reason || null }),
    });
    el.disabled = false;
    if (res.ok || res.status === 204) {
      const sub = subscribers.find(x => x.id === id);
      if (sub) sub.churn_reason = reason || null;
      renderTable();
    } else {
      alert('사유 저장에 실패했습니다.');
    }
  } catch(e) {
    el.disabled = false;
    alert('오류: ' + e.message);
  }
}

function onChurnInlineChange(id, value, el) {
  if (value === '기타') {
    const input = prompt('이탈 사유를 입력하세요', '');
    if (input === null || !input.trim()) {
      renderTable();
      return;
    }
    updateChurnReason(id, input.trim(), el);
  } else {
    updateChurnReason(id, value, el);
  }
}

async function confirmAction() {
  if (!currentAction) return;
  const { type, id } = currentAction;
  const newStatus = type === 'cancel' ? 'cancelled' : 'active';
  const btn = document.getElementById('modal-confirm-btn');
  btn.disabled = true;
  btn.textContent = '처리중...';
  let churnReason = null;
  if (type === 'cancel') {
    const sel = document.getElementById('churn-reason-select').value;
    if (sel === '기타') {
      churnReason = document.getElementById('churn-reason-etc').value.trim() || '기타';
    } else if (sel) {
      churnReason = sel;
    }
  }
  try {
    const res = await fetch(`${VERCEL_URL}/api/cancel-subscriber`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status: newStatus })
    });
    const data = await res.json();
    if (data.success) {
      // 해지일 기록 (해지 시에만, 복구 시엔 null로 초기화)
      const patchBody = type === 'cancel'
        ? { churn_reason: churnReason, cancelled_at: new Date().toISOString() }
        : { churn_reason: null, cancelled_at: null };
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/subscribers?id=eq.${id}`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal',
          },
          body: JSON.stringify(patchBody),
        });
      } catch(e) {}
      closeModal();
      loadSubscribers();
    } else {
      alert('오류: ' + (data.error || '다시 시도해주세요'));
      btn.disabled = false;
      btn.textContent = '확인';
    }
  } catch(e) {
    alert('오류가 발생했습니다. 다시 시도해주세요.');
    btn.disabled = false;
    btn.textContent = '확인';
  }
}

// ===== 회원 구독 이력 =====
// subscription_events 표(Supabase 트리거가 자동 기록)를 시간순으로 보여준다.
// 표가 아직 없으면 subscribers 의 가입일/해지일만으로 간단히 보여준다.
const EVENT_LABELS = {
  signup: '가입', cancel: '해지', return: '복귀', payment_failed: '결제 실패', plan_change: '플랜 변경'
};

function fmtKstDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  const p = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'short' }).formatToParts(d);
  const g = t => (p.find(x => x.type === t) || {}).value;
  return `${g('year')}. ${g('month')}. ${g('day')}. (${g('weekday')})`;
}
function kstYmd(iso) { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date(iso)); }
function daysBetween(a, b) { return diffDaysYmd(kstYmd(a), kstYmd(b)); }
// 두 시점 사이를 달력 기준 "N개월 N일"로 (총 일수만 있을 땐 30일=1개월 근사)
function fmtSpan(days, fromIso, toIso) {
  if (days < 31 || !fromIso) {
    if (days < 31) return `${days}일`;
    const m = Math.floor(days / 30), d = days - m * 30;
    return d ? `${m}개월 ${d}일` : `${m}개월`;
  }
  const a = kstYmd(fromIso), b = kstYmd(toIso);
  const [ay, am, ad] = a.split('-').map(Number), [by, bm, bd] = b.split('-').map(Number);
  let m = (by - ay) * 12 + (bm - am);
  if (bd < ad) m--;
  const anchor = new Date(Date.UTC(ay, am - 1 + m, 1));
  const last = new Date(Date.UTC(anchor.getUTCFullYear(), anchor.getUTCMonth() + 1, 0)).getUTCDate();
  const d = diffDaysYmd(new Date(Date.UTC(anchor.getUTCFullYear(), anchor.getUTCMonth(), Math.min(ad, last))).toISOString().slice(0, 10), b);
  return d ? `${m}개월 ${d}일` : `${m}개월`;
}
const isUnknownDate = e => e.note === '해지일 미상';

function fallbackEvents(s) {
  const ev = [];
  if (s.created_at) ev.push({ event_type: 'signup', occurred_at: s.created_at, plan: s.plan, source: 'backfill' });
  if (s.status === 'cancelled') ev.push({ event_type: 'cancel', occurred_at: s.cancelled_at || s.created_at, plan: s.plan, reason: s.churn_reason, note: s.cancelled_at ? null : '해지일 미상', source: 'backfill' });
  if (s.status === 'payment_failed') ev.push({ event_type: 'payment_failed', occurred_at: s.next_billing_date ? `${String(s.next_billing_date).slice(0,10)}T18:00:00+09:00` : s.created_at, plan: s.plan, source: 'backfill' });
  return ev;
}

async function openHistory(id) {
  const s = subscribers.find(x => String(x.id) === String(id));
  if (!s) return;
  const statusTxt = s.status === 'active' ? '활성' : s.status === 'payment_failed' ? '결제실패' : '해지';
  document.getElementById('history-title').textContent = `${s.name || '-'}님 구독 이력`;
  document.getElementById('history-meta').textContent = `${s.phone || '-'} · 현재 ${s.plan || '-'} · ${statusTxt}`;
  document.getElementById('history-summary').innerHTML = '';
  document.getElementById('history-body').innerHTML = '<div class="loading" style="padding:32px">불러오는 중...</div>';
  document.getElementById('history-modal').classList.add('active');

  let events = null, tableMissing = false;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/subscription_events?subscriber_id=eq.${encodeURIComponent(id)}&select=*&order=occurred_at.asc,id.asc`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if (res.ok) events = await res.json();
    else tableMissing = true;
  } catch (e) { tableMissing = true; }
  if (!Array.isArray(events) || !events.length) events = fallbackEvents(s);
  renderHistory(s, events, tableMissing);
}

function renderHistory(s, events, tableMissing) {
  // 이용 기간 / 쉰 기간 계산
  let activeSince = null, lastStop = null, totalDays = 0;
  let cancels = 0, returns = 0;
  const items = events.map(e => {
    let gap = '';
    const t = e.occurred_at;
    if (e.event_type === 'signup' || e.event_type === 'return') {
      if (e.event_type === 'return') {
        returns++;
        if (lastStop && !isUnknownDate(lastStop)) {
          const g = daysBetween(lastStop.occurred_at, t);
          gap = g < 1 ? '중단 당일 바로 복귀' : `${fmtSpan(g, lastStop.occurred_at, t)} 쉬고 복귀`;
        }
      }
      activeSince = t; lastStop = null;
    } else if (e.event_type === 'cancel' || e.event_type === 'payment_failed') {
      if (e.event_type === 'cancel') cancels++;
      if (activeSince && !isUnknownDate(e)) {
        const d = Math.max(0, daysBetween(activeSince, t));
        totalDays += d;
        const what = e.event_type === 'cancel' ? '해지' : '결제 중단';
        gap = d < 1 ? `시작 당일 ${what}` : `${fmtSpan(d, activeSince, t)} 이용 후 ${what}`;
      }
      activeSince = null; lastStop = e;
    }
    let detail = '';
    if (e.event_type === 'signup') detail = e.plan || '';
    else if (e.event_type === 'return') detail = e.from_plan ? `${e.from_plan} → ${e.plan}` : (e.plan || '');
    else if (e.event_type === 'plan_change') detail = `${e.from_plan || '?'} → ${e.plan || '?'}`;
    else if (e.event_type === 'cancel') detail = `사유: ${e.reason || '미입력'}`;
    else if (e.event_type === 'payment_failed') detail = '자동결제가 되지 않았어요 (잔액 부족·카드 만료 등)';
    if (e.note && e.note !== '해지일 미상') detail += detail ? ` · ${e.note}` : e.note;
    const date = isUnknownDate(e) ? '날짜 미상' : fmtKstDate(t);
    return `<li class="tl-item tl-${escHtml(e.event_type)}">
      <span class="tl-dot"></span>
      <div class="tl-date">${date}</div>
      <div class="tl-title">${EVENT_LABELS[e.event_type] || escHtml(e.event_type)}</div>
      ${detail ? `<div class="tl-detail">${escHtml(detail)}</div>` : ''}
      ${gap ? `<div class="tl-gap">${gap}</div>` : ''}
    </li>`;
  });
  if (activeSince && s.status === 'active') totalDays += Math.max(0, daysBetween(activeSince, new Date().toISOString()));

  document.getElementById('history-summary').innerHTML = `
    <div><b>${totalDays ? `${totalDays}일` : '-'}</b><span>총 이용${totalDays >= 45 ? ` · 약 ${(totalDays / 30.44).toFixed(1)}개월` : ' 기간'}</span></div>
    <div><b>${cancels}회</b><span>해지</span></div>
    <div><b>${returns}회</b><span>복귀</span></div>`;

  let note = '';
  if (tableMissing) {
    note = '이력 기록이 아직 켜져 있지 않아 가입일·해지일만 보여드려요. Supabase에서 sql/subscription_events.sql 을 한 번 실행하면 이후 모든 해지·복귀가 자동으로 쌓입니다.';
  } else if (events.some(e => e.source === 'backfill')) {
    note = '2026년 11월 이전 기록은 남아 있던 데이터로 복원한 것이라, 그 전에 해지했다가 복귀한 이력은 빠져 있을 수 있어요.';
  }
  document.getElementById('history-body').innerHTML =
    (items.length ? `<ul class="timeline">${items.join('')}</ul>` : '<div class="empty" style="padding:32px">기록이 없습니다.</div>') +
    (note ? `<div class="history-note">${note}</div>` : '');
}

function closeHistoryModal() {
  document.getElementById('history-modal').classList.remove('active');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHistoryModal(); });

// ===== 결제일 변경 =====
// 날짜는 전부 'YYYY-MM-DD' 문자열로 다룬다 (시간대 때문에 하루 밀리는 것 방지).
// 자동결제(billing-charge)는 next_billing_date === 오늘인 회원만 청구하므로
// 지난 날짜나 잘못된 형식이 저장되면 그 회원은 다시는 결제되지 않는다 → 여기서 막는다.
let currentBillingAction = null;

function todayKST() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());
}
function addDaysYmd(ymd, n) {
  const [y, m, d] = ymd.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
function diffDaysYmd(from, to) {
  const toUtc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((toUtc(to) - toUtc(from)) / 86400000);
}
function fmtYmdKo(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  const dow = ['일','월','화','수','목','금','토'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  return `${y}. ${m}. ${d}. (${dow})`;
}
function isValidYmd(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  return addDaysYmd(s, 0) === s;   // 2026-02-30 같은 없는 날짜 거르기
}

function openBillingModal(id) {
  const s = subscribers.find(x => String(x.id) === String(id));
  if (!s) { alert('회원 정보를 찾을 수 없습니다. 새로고침 후 다시 시도해주세요.'); return; }
  const today = todayKST();
  const current = s.next_billing_date && isValidYmd(String(s.next_billing_date).slice(0, 10))
    ? String(s.next_billing_date).slice(0, 10) : null;
  currentBillingAction = { id: s.id, name: s.name, current, base: current || today };
  document.getElementById('billing-modal-desc').textContent =
    `${s.name}님 · ${s.plan} · 현재 다음 결제일 ${current ? fmtYmdKo(current) : '없음'}`;
  const dateInput = document.getElementById('billing-date');
  dateInput.min = addDaysYmd(today, 1);
  dateInput.value = '';
  document.getElementById('billing-days').value = '';
  renderBillingPreview();
  document.getElementById('billing-modal').classList.add('active');
}

function closeBillingModal() {
  document.getElementById('billing-modal').classList.remove('active');
  const btn = document.getElementById('billing-confirm-btn');
  btn.disabled = false;
  btn.textContent = '변경';
  currentBillingAction = null;
}

function setBillingDays(n) {
  document.getElementById('billing-days').value = n;
  onBillingDaysInput();
}
function onBillingDaysInput() {
  const a = currentBillingAction; if (!a) return;
  const n = parseInt(document.getElementById('billing-days').value, 10);
  document.getElementById('billing-date').value = isNaN(n) ? '' : addDaysYmd(a.base, n);
  renderBillingPreview();
}
function onBillingDateInput() {
  const a = currentBillingAction; if (!a) return;
  const v = document.getElementById('billing-date').value;
  document.getElementById('billing-days').value = isValidYmd(v) ? diffDaysYmd(a.base, v) : '';
  renderBillingPreview();
}

// 입력값 검사. 문제 있으면 에러 문구, 없으면 null
function billingError(newDate) {
  const a = currentBillingAction;
  if (!newDate) return '새 결제일을 입력해주세요.';
  if (!isValidYmd(newDate)) return '날짜 형식이 올바르지 않습니다.';
  const today = todayKST();
  if (newDate <= today) return '결제일은 내일 이후로만 설정할 수 있습니다. (지난 날짜가 저장되면 자동결제가 영영 안 됩니다)';
  if (a.current && newDate === a.current) return '현재 결제일과 같습니다.';
  return null;
}

function renderBillingPreview() {
  const a = currentBillingAction; if (!a) return;
  const v = document.getElementById('billing-date').value;
  const preview = document.getElementById('billing-preview');
  const errEl = document.getElementById('billing-error');
  const err = v ? billingError(v) : null;
  errEl.style.display = err ? 'block' : 'none';
  errEl.textContent = err || '';
  if (!v || !isValidYmd(v)) {
    preview.innerHTML = '미룰 일수를 입력하거나 날짜를 직접 고르세요.';
    return;
  }
  const shift = a.current ? diffDaysYmd(a.current, v) : null;
  const shiftTxt = shift === null ? '' : (shift > 0 ? ` <b>(${shift}일 뒤로)</b>` : ` <b style="color:#dc2626">(${-shift}일 앞으로)</b>`);
  preview.innerHTML =
    `${a.current ? fmtYmdKo(a.current) : '없음'} → <b>${fmtYmdKo(v)}</b>${shiftTxt}<br>` +
    `<span style="color:var(--text-light)">그날 오후 6시에 자동결제되고, 이후 매달 같은 날짜로 이어집니다.</span>`;
}

async function confirmBillingChange() {
  const a = currentBillingAction;
  if (!a) return;
  const newDate = document.getElementById('billing-date').value;
  const err = billingError(newDate);
  if (err) { renderBillingPreview(); alert(err); return; }
  const fromToday = diffDaysYmd(todayKST(), newDate);
  if (fromToday > 92 && !confirm(`오늘부터 ${fromToday}일 뒤입니다. 그동안 결제가 없습니다. 맞나요?`)) return;
  if (a.current && newDate < a.current && !confirm('결제일을 앞당기는 변경입니다. 맞나요?')) return;

  const btn = document.getElementById('billing-confirm-btn');
  btn.disabled = true;
  btn.textContent = '처리중...';
  const { id, name } = a;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/subscribers?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
      },
      body: JSON.stringify({ next_billing_date: newDate }),
    });
    // 저장된 값을 돌려받아 실제로 바뀌었는지 확인 (권한 문제로 0건 수정돼도 200이 오기 때문)
    const rows = res.ok ? await res.json().catch(() => []) : [];
    const saved = Array.isArray(rows) && rows[0] && String(rows[0].next_billing_date).slice(0, 10);
    closeBillingModal();
    if (saved === newDate) {
      loadSubscribers();
      alert(`${name}님 다음 결제일이 ${fmtYmdKo(newDate)}로 변경되었습니다.`);
    } else {
      alert('결제일 변경에 실패했습니다. 새로고침 후 다시 확인해주세요.');
    }
  } catch (e) {
    alert('오류: ' + e.message);
    closeBillingModal();
  }
}

// ===== 신규 구독 알림 =====
// 이 페이지가 열려 있으면 1분마다 구독자 목록을 확인해서, 새로 첫 결제를 마친 회원이 생기면
// ① 화면 위 배너 ② 컴퓨터 알림(Windows 오른쪽 아래) ③ 알림음 ④ 탭 제목 "(1)" 으로 알려준다.
// 자동 로그아웃된 뒤에도 탭만 열려 있으면 계속 확인한다 (이때는 이름 없이 "신규 1명"으로만 표시).
const SIGNUP_POLL_MS = 60 * 1000;
const SIGNUP_SEEN_KEY = 'admin_signup_seen_at';
const SIGNUP_ALERT_KEY = 'admin_signup_alert_on';
const BASE_TITLE = document.title;
let signupSeenAt = null;
let unseenSignupCount = 0;
let alertAudioCtx = null;

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function isLoggedIn() { return document.getElementById('admin-screen').style.display === 'block'; }

function renderSignupAlertBtn() {
  const btn = document.getElementById('signup-alert-btn');
  if (!btn) return;
  btn.classList.remove('alert-on', 'alert-off');
  if (!('Notification' in window)) {
    btn.textContent = '🔔 화면 알림만 가능';
    btn.title = '이 브라우저는 컴퓨터 알림을 지원하지 않아 화면 배너와 소리로만 알려드립니다';
    return;
  }
  if (Notification.permission === 'granted' && lsGet(SIGNUP_ALERT_KEY) === '1') {
    btn.textContent = '🔔 신규 알림 켜짐';
    btn.classList.add('alert-on');
    btn.title = '이 컴퓨터에서 새 구독 알림을 받고 있어요. 다시 누르면 시험 알림이 떠요.';
  } else if (Notification.permission === 'denied') {
    btn.textContent = '🔕 알림 차단됨';
    btn.classList.add('alert-off');
    btn.title = '주소창 왼쪽 자물쇠 아이콘 → 알림 → 허용으로 바꾼 뒤 새로고침하세요';
  } else {
    btn.textContent = '🔔 신규 알림 켜기';
  }
}

async function enableSignupAlerts() {
  // 소리는 사용자가 한 번 클릭해야 재생이 허용되므로 여기서 준비
  try {
    alertAudioCtx = alertAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    await alertAudioCtx.resume();
  } catch (e) {}
  if (!('Notification' in window)) { lsSet(SIGNUP_ALERT_KEY, '1'); playSignupSound(); renderSignupAlertBtn(); return; }
  if (Notification.permission === 'denied') {
    alert('알림이 차단돼 있어요.\n주소창 왼쪽 자물쇠 아이콘 → 알림 → "허용"으로 바꾼 뒤 새로고침해 주세요.');
    return;
  }
  const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  if (perm === 'granted') {
    lsSet(SIGNUP_ALERT_KEY, '1');
    showDesktopNotice('신규 알림이 켜졌어요', '새 구독자가 결제를 마치면 이렇게 알려드릴게요.');
    playSignupSound();
  }
  renderSignupAlertBtn();
}

function playSignupSound() {
  try {
    const ctx = alertAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    alertAudioCtx = ctx;
    [[880, 0], [1320, 0.18]].forEach(([freq, at]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + at);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + at + 0.35);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + at); o.stop(ctx.currentTime + at + 0.4);
    });
  } catch (e) {}
}

function showDesktopNotice(title, body) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const n = new Notification(title, { body, tag: 'signup-' + Date.now(), requireInteraction: true });
    n.onclick = () => { window.focus(); n.close(); };
  } catch (e) {}
}

function showSignupToast(text) {
  let el = document.getElementById('signup-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'signup-toast';
    el.className = 'signup-toast';
    document.body.appendChild(el);
  }
  el.innerHTML = `<span>${text}</span><button type="button" onclick="dismissSignupToast()">확인</button>`;
  el.classList.add('show');
}
function dismissSignupToast() {
  const el = document.getElementById('signup-toast');
  if (el) el.classList.remove('show');
  unseenSignupCount = 0;
  document.title = BASE_TITLE;
}
window.addEventListener('focus', () => { if (unseenSignupCount && !document.getElementById('signup-toast')?.classList.contains('show')) dismissSignupToast(); });

const escHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

async function checkNewSignups() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/subscribers?select=id,name,plan,status,created_at&order=created_at.desc&limit=30`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if (!res.ok) return;
    const rows = await res.json();
    if (!Array.isArray(rows) || !rows.length) return;
    const t = (r) => Date.parse(r.created_at) || 0;
    const newest = Math.max(...rows.map(t));

    if (signupSeenAt === null) {
      const saved = parseInt(lsGet(SIGNUP_SEEN_KEY), 10);
      // 처음 켠 컴퓨터는 지금까지의 가입을 '이미 본 것'으로 시작 (옛날 가입으로 알림 폭탄 방지)
      signupSeenAt = Number.isFinite(saved) ? saved : newest;
    }
    const fresh = rows.filter(r => t(r) > signupSeenAt && r.status === 'active').sort((a, b) => t(a) - t(b));
    signupSeenAt = Math.max(signupSeenAt, newest);
    lsSet(SIGNUP_SEEN_KEY, String(signupSeenAt));
    if (!fresh.length) return;

    unseenSignupCount += fresh.length;
    document.title = `(${unseenSignupCount}) 신규 구독 · ${BASE_TITLE}`;
    const loggedIn = isLoggedIn();
    const label = (r) => `${r.name} · ${r.plan}`;
    const summary = loggedIn
      ? (fresh.length === 1 ? label(fresh[0]) : `${label(fresh[0])} 외 ${fresh.length - 1}명`)
      : `${fresh.length}명 (로그인해서 확인하세요)`;

    showSignupToast(loggedIn
      ? `🎉 신규 구독 <b>${escHtml(summary)}</b>`
      : `🎉 신규 구독 <b>${fresh.length}명</b> — 로그인해서 확인하세요`);
    if (lsGet(SIGNUP_ALERT_KEY) === '1') {
      showDesktopNotice('🎉 990짐 신규 구독', summary);
      playSignupSound();
    }
    if (loggedIn) loadSubscribers();
  } catch (e) {}
}

renderSignupAlertBtn();
checkNewSignups();
setInterval(checkNewSignups, SIGNUP_POLL_MS);
</script>
</body>
</html>
